harness:
  webhook:
    # Фиксированный секрет capability-токенов для тестов (WebhooksRoutingTest считает HMAC по нему же).
    secret: test-webhook-secret
    payload-summary:
      # Малый лимит: test-payloadSummaryTruncation гоняет усечение без гигантских payload'ов.
      byte-size-limit: 64
  security:
    # Живой Keycloak тестового контекста (позитивный путь и groups-гейт — через реальный Keycloak)
    issuer-uri: ${containers.keycloak.url}/realms/harness
    jwk-set-uri: ${containers.keycloak.url}/realms/harness/protocol/openid-connect/certs
  sse:
    # Быстрый ping для проверки ping-кадров реальным SSE-клиентом (задача 8.5).
    ping-interval: 200ms
  limits:
    # Малый лимит тела для проверки 413 без гигантских запросов (задача 8.1).
    body: 8KB
    page: 100
  llm:
    # Тестовый ключ шифрования api_key (32 байта, base64) — тот же, что в тестовых фикстурах.
    encryption-keys:
      1: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  lock:
    # Быстрый heartbeat для проверки продления лока реальным таймером (task 7.1).
    heartbeat-interval: 200ms
  turn:
    # POLL-джоба в тестах не стартует сама (первый запуск через интервал); Act вызывает poll() напрямую.
    poll-interval: 1h
    llm-retries: 2
    backoff-base: 100ms
  task:
    # Задачные джобы в тестах не тикают сами (Act вызывает методы напрямую);
    # BASH-раскачка по wake выключена — executor тесты зовут напрямую (детерминизм).
    poll-interval: 1h
    timeout:
      scan-interval: 1h
    bash-dispatch:
      enabled: false
  docker:
    # Образ собирается DockerTestSupport'ом из docker/Dockerfile до первого docker-теста.
    helper-image: harness-helper:test
    workspace-root: ${java.io.tmpdir}/harness-it-workspaces

spring:
  liquibase:
    change-log: classpath:db/changelog-test/changelog-test.xml
