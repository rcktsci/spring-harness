harness:
  webhook:
    # Секрет HMAC capability-токенов вебхуков (token = HMAC-SHA256(secret, kind:entityId),
    # api-contracts §4.4); в рантайме VM — через env HARNESS_WEBHOOK_SECRET.
    secret: ${HARNESS_WEBHOOK_SECRET:dev-webhook-secret-not-for-prod}
  security:
    allowed-groups: [harness-users]
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/harness}
    jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/harness/protocol/openid-connect/certs}
  lock:
    session-ttl: 10m
    heartbeat-interval: 30s
    job-ttl: 10s
  turn:
    poll-interval: 5s
    llm-retries: 3
    backoff-base: 1s
  llm:
    timeout: 60s
    encryption-keys:
      1: ${HARNESS_LLM_KEY_V1:}
  compact:
    threshold: 0.8
  docker:
    helper-image: harness-helper:local
    # Абсолютный путь: bind-mount хостового каталога резолвится демоном от ФС хоста, не от CWD процесса.
    workspace-root: ${HARNESS_WORKSPACE_ROOT:workspaces/sessions}
    cpu-nanos: 1000000000
    memory: 512MB
    network: none
    pull-timeout: 30s
    start-timeout: 30s
    exec-timeout: 60s
    state-poll-interval: 50ms
    container-stop-confirm: 3s
    write-chunk-bytes: 60000
    pull-retries: 3
    pull-backoff: 2s
  sse:
    ping-interval: 15s
    # 0 — без таймаута эмиттера (соединение держится, реконнект — забота клиента)
    timeout: 0s
  limits:
    body: 1MB
    tool-output: 256KB
    tool-capture-margin: 4KB
    bash-timeout: 30s
    bash-timeout-cap: 5m
    page: 100

spring:
  main.banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:harness}
    username: ${DB_USERNAME:harness}
    password: ${DB_PASSWORD:harness}
  liquibase:
    change-log: classpath:db/changelog/changeset-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} %clr(%5p) %clr([%12.12t]){faint} %clr(%-48.48logger{39}){blue} : %m%n%wEx'
  level:
    root: INFO
    se.rocketscien: DEBUG
