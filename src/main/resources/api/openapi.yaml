      - $ref: '#/components/parameters/WebhookToken'
    post:
      tags: [Webhooks]
      operationId: handleTaskWebhook
      summary: Вебхук задачи (WAIT_WEBHOOK → NEXT)
      description: >-
        Без JWT: token = HMAC-SHA256(server_secret, "task:"+taskId); невалидный →
        401 signature-invalid (тело не парсится). Задача должна существовать и быть
        в WAIT_WEBHOOK — иначе 409 task-not-waiting-webhook (идемпотентность по
        построению: повторная доставка после перехода — тоже 409). Payload, не
        прошедший payloadSchema состояния (если объявлена; ограниченный профиль
        JSON-Schema) → 202 + переход ERROR с reason {validationErrors}. Успех — 202:
        атомарный CAS переход NEXT, payload+source → reason {kind:webhook, source,
        payloadSummary}. Тело обязательно — POST без тела или без Content-Type
        application/json → 415 unsupported-media-type (до проверки состояния).
        Результат виден в SSE задачи.
      security: []
      parameters:
        - name: source
          in: query
          required: false
          description: Метка источника для reason перехода (например имя внешней системы).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Обязательный JSON-payload вебхука (произвольный объект); валидность — по payloadSchema состояния (если объявлена, ограниченный профиль D-58).
      responses:
        '202':
          description: Payload принят (переход NEXT или ERROR — в истории/SSE задачи).
          content:
            application/json:
              schema: {}
        '401': { $ref: '#/components/responses/SignatureInvalid' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409': { $ref: '#/components/responses/TaskNotWaitingWebhook' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /webhooks/triggers/{triggerId}/{token}:
    servers:
      - url: /api
        description: Вебхуки — вне /v1 (api-contracts §0.5); без JWT.
    parameters:
      - $ref: '#/components/parameters/WebhookTriggerId'
      - $ref: '#/components/parameters/WebhookToken'
    post:
      tags: [Webhooks]
      operationId: handleTriggerWebhook
      summary: Вебхук триггера (создание задачи)
      description: >-
        Без JWT: token = HMAC-SHA256(server_secret, "trigger:"+triggerId); невалидный
        → 401 signature-invalid. Отозванный триггер → 410 trigger-revoked. Успех —
        202 {taskId}: задача создана на пиннутой ревизии с params/tags/owner
        триггера; AGENT-стартовое состояние бутстрэпится движком. Тело запроса
        не принимается.
      security: []
      responses:
        '202':
          description: Задача создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerWebhookAccepted'
        '401': { $ref: '#/components/responses/SignatureInvalid' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '410': { $ref: '#/components/responses/TriggerRevoked' }
components:
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Идентификатор сессии.
      schema:
        type: string
        format: uuid
    Since:
      name: since
      in: query
      required: false
      description: Курсор seq — события с seq > since (интервал (since, …]); 0 или отсутствие — с начала журнала.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: Максимум элементов страницы; минимум 1, верхняя граница — конфиг сервера.
      schema:
        type: integer
        format: int32
        minimum: 1
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный (opaque) курсор из nextCursor предыдущей страницы.
      schema:
        type: string
    Depth:
      name: depth
      in: query
      required: false
      description: Максимальная глубина поддерева; отсутствие — всё поддерево.
      schema:
        type: integer
        format: int32
        minimum: 0
    TaskId:
      name: id
      in: path
      required: true
      description: Идентификатор задачи.
      schema:
        type: string
        format: uuid
    BlockerId:
      name: blockerId
      in: path
      required: true
      description: Идентификатор блокирующей задачи (ребро blocked_by).
      schema:
        type: string
        format: uuid
    WorkflowKey:
      name: key
      in: path
      required: true
      description: Ключ workflow (kebab-case).
      schema:
        type: string
        minLength: 1
    Revision:
      name: rev
      in: path
      required: true
      description: Номер ревизии (1, 2, …).
      schema:
        type: integer
        format: int32
        minimum: 1
    TriggerId:
      name: id
      in: path
      required: true
      description: Идентификатор триггера.
      schema:
        type: string
        format: uuid
    WebhookTaskId:
      name: taskId
      in: path
      required: true
      description: Идентификатор задачи в capability-URL.
      schema:
        type: string
        format: uuid
    WebhookTriggerId:
      name: triggerId
      in: path
      required: true
      description: Идентификатор триггера в capability-URL.
      schema:
        type: string
        format: uuid
    WebhookToken:
      name: token
      in: path
      required: true
      description: Capability-токен — HMAC-SHA256(server_secret, kind+':'+entityId); неверный → 401 signature-invalid.
      schema:
        type: string
        minLength: 1
  responses:
    Unauthorized:
      description: '401, code=unauthenticated — нет/невалиден Bearer-токен либо группа JWT вне allowed-groups (SSO-гейт).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    SessionNotFound:
      description: '404, code=session-not-found.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    AgentNotFound:
      description: '404, code=agent-not-found — agentKey или agentRev не существуют.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    WrongSessionKind:
      description: '409, code=wrong-session-kind — команда неприменима к роду сессии (compact на STATE).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PayloadTooLarge:
      description: '413, code=payload-too-large — тело превышает harness.limits.body (дефолт 1 МБ).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    MethodNotAllowed:
      description: >-
        405, code=method-not-allowed — путь существует, метод не поддержан. Возможен на любом
        пути чужим методом; в operations не перечисляется (в OpenAPI невыразимо).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotAcceptable:
      description: '406, code=not-acceptable — Accept не содержит поддерживаемого представления (application/json; для SSE-потока — text/event-stream).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnsupportedMediaType:
      description: '415, code=unsupported-media-type — Content-Type не поддержан (для PATCH только application/merge-patch+json).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationFailed:
      description: '422, code=validation-failed — тело/параметры невалидны; errors[] с pointer/rule/message.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TaskNotFound:
      description: '404, code=task-not-found.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    WorkflowNotFound:
      description: '404, code=workflow-not-found — ключ или ревизия workflow не существуют.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TriggerNotFound:
      description: '404, code=trigger-not-found.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TaskAlreadyTerminal:
      description: '409, code=task-already-terminal — задача в терминале (SUCCEEDED|FAILED|CANCELLED); resume/stop неприменимы.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    WrongTransition:
      description: >-
        409, code=wrong-transition — переход не по разрешённому исходящему ребру
        текущего состояния (rule=not-an-outgoing-edge) либо пустой reason
        (rule=reason-required). Достигается инструментом агента `transition`
        (гейт metaTools), не REST-операцией M2; в каталоге §6 — для полноты.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    GraphInvalid:
      description: '422, code=graph-invalid — граф нарушает правила построения; errors[] {pointer, rule, message}.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    DependencyInvalid:
      description: '422, code=dependency-invalid — self-loop, цикл или несуществующий taskId; errors[].'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ParamsSchema:
      description: '422, code=params-schema — params не прошли paramsSchema ревизии (ограниченный профиль JSON-Schema); errors[] по схеме.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    SignatureInvalid:
      description: >-
        401, code=signature-invalid — capability-токен не прошёл HMAC-проверку;
        без challenge, тело запроса не парсится. Только на вебхуках (без JWT).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WebhookError'
    TaskNotWaitingWebhook:
      description: >-
        409, code=task-not-waiting-webhook — задачи нет либо она вне WAIT_WEBHOOK;
        идемпотентность вебхука по построению (повторная доставка — тоже 409).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WebhookError'
    TriggerRevoked:
      description: '410, code=trigger-revoked — триггер отозван (revoked_at установлен), capability-URL умер.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/WebhookError'
  schemas:
    SessionKind:
      type: string
      enum: [FREE, STATE]
      description: >-
        Род сессии. POST /sessions создаёт только FREE; STATE принадлежит паре
        «задача × состояние» и создаётся/резюмируется движком задач (M2).
    SessionRuntimeStatus:
      type: string
      enum: [IDLE, TURN_RUNNING, PARKED_ASYNC, PARKED_CLIENT]
      description: >-
        M2: enum расширен до четырёх значений. IDLE — активного Turn'а нет;
        TURN_RUNNING — Turn выполняется; PARKED_ASYNC — ждёт асинхронный инструмент
        (присвоение с M3); PARKED_CLIENT — задача на клиенте-реле (присвоение с M4).
        В M2 фактически встречаются IDLE и TURN_RUNNING.
    TurnOutcome:
      type: string
      enum: [COMPLETED, FAILED, CANCELLED]
      description: Исход последнего Turn'а.
    SessionStatusEvent:
      type: object
      description: >-
        Данные кадра `session.status` SSE-потока (и снапшота при коннекте/реконнекте).
        Тело SSE схемой не типизируется — схема служит машинным якорем для ручного
        парсера (клиент 8.5, attach-CLI).
      required: [runtimeStatus]
      properties:
        runtimeStatus:
          $ref: '#/components/schemas/SessionRuntimeStatus'
        lastTurnOutcome:
          $ref: '#/components/schemas/TurnOutcome'
          description: Отсутствует/null до завершения первого Turn'а.
    MessageKind:
      type: string
      enum: [USER, ASSISTANT, SYSTEM, TOOL_CALL, TOOL_RESULT, COMPACT, ASYNC_ACCEPTED]
      description: >-
        Вид события журнала. COMPACT скрывает покрываемые им события — видимость производная
        (сообщение скрыто ⟺ существует более поздний COMPACT, покрывающий его).
        ASYNC_ACCEPTED (M3) — плейсхолдер «принято, в полёте» для async-capable инструмента;
        финальным результатом не считается, закрывается поздним TOOL_RESULT (late=true)
        либо синтетическим LOST.
    ProblemCode:
      type: string
      enum:
        - validation-failed
        - unauthenticated
        - session-not-found
        - agent-not-found
        - wrong-session-kind
        - payload-too-large
        - method-not-allowed
        - not-acceptable
        - unsupported-media-type
        - task-not-found
        - workflow-not-found
        - trigger-not-found
        - task-not-waiting-webhook
        - task-already-terminal
        - wrong-transition
        - graph-invalid
        - dependency-invalid
        - params-schema
        - trigger-revoked
        - signature-invalid
      description: >-
        Каталог кодов ошибок M1+M2 (api-contracts §6). Точное значение для каждого ответа
        зафиксировано в description соответствующего response-компонента. M2-коды:
        task-not-found, workflow-not-found, trigger-not-found, task-not-waiting-webhook,
        task-already-terminal, wrong-transition (переход не по ребру/пустой reason —
        инструмент агента), graph-invalid, dependency-invalid, params-schema,
        trigger-revoked, signature-invalid (вебхуки).
    AgentRef:
      type: object
      description: Ссылка на пиннутую ревизию агента.
      required: [key, rev]
      properties:
        key:
          type: string
        rev:
          type: integer
          format: int32
          minimum: 1
    WorkspaceBinding:
      type: object
      description: >-
        Привязка workspace. В M1 все сессии — SERVER_DIR (auto: workspaces/sessions/{sessionId});
        CLIENT_EXEC и pathTemplate/logicalKey — последующие фазы.
      required: [type]
      properties:
        type:
          type: string
          enum: [SERVER_DIR]
    AgentCatalogItem:
      type: object
      required: [key, name, latestRev]
      properties:
        key:
          type: string
        name:
          type: string
        latestRev:
          type: integer
          format: int32
          minimum: 1
        description:
          type: string
    SessionDto:
      type: object
      description: >-
        Состояние сессии. M2: добавлены taskId/stateCode — только для STATE-сессий
        (пара «задача × состояние»; у FREE отсутствуют/null); runtimeStatus расширен
        до PARKED_* (присвоение — M3/M4). parentSessionId — M3 (субагенты).
      required: [id, kind, title, owner, agent, workspaceBinding, runtimeStatus, lastSeq, lastActivityAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SessionKind'
        title:
          type: [string, 'null']
          description: Название; поле присутствует всегда, null — если не задано при создании.
        owner:
          type: string
          description: username владельца; метаданные для UI/фильтра mine (не барьер доступа, D-41). У STATE-сессии — владелец задачи.
        agent:
          $ref: '#/components/schemas/AgentRef'
        workspaceBinding:
          $ref: '#/components/schemas/WorkspaceBinding'
        runtimeStatus:
          $ref: '#/components/schemas/SessionRuntimeStatus'
        lastTurnOutcome:
          $ref: '#/components/schemas/TurnOutcome'
          description: Отсутствует до завершения первого Turn'а.
        taskId:
          type: string
          format: uuid
          description: Только STATE-сессии — идентификатор задачи; у FREE отсутствует/null.
        stateCode:
          type: string
          description: Только STATE-сессии — code состояния ревизии задачи; у FREE отсутствует/null.
        lastSeq:
          type: integer
          format: int64
          minimum: 0
          description: Позиция последнего события журнала (курсор для attach).
        lastActivityAt:
          type: string
          format: date-time
          description: ISO-8601 UTC; по ней сортируется список сессий (desc).
        createdAt:
          type: string
          format: date-time
    MessageDto:
      type: object
      description: Событие журнала сессии (append-only; PATCH/DELETE не существует).
      required: [id, seq, kind, payload, createdAt]
      properties:
        id:
          type: string
          description: ULID (26 символов, Crockford base32 — без I, L, O, U).
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          minLength: 26
          maxLength: 26
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Позиция в журнале сессии; курсор since и SSE id.
        kind:
          $ref: '#/components/schemas/MessageKind'
        author:
          type: string
          description: username автора; только для kind=USER (иначе отсутствует).
        payload:
          type: object
          additionalProperties: true
          description: >-
            JSONB-объект; форма зависит от kind (форматы зафиксированы TurnPayloads):
            USER/ASSISTANT/SYSTEM — {"text": string} (SYSTEM — причина сбоя тем же ключом);
            TOOL_CALL — {"callId": ULID, "toolCallId"?: string, "tool": string, "arguments": object};
            TOOL_RESULT — {"callId": ULID, "tool": string, "status": OK|ERROR|CANCELLED|LOST,
            "output"?, "exitCode"?, "truncated"?, "timedOut"?, "late"?: true};
            ASYNC_ACCEPTED — {"callId": ULID, "tool": string} (M3, плейсхолдер);
            COMPACT — {"covers": [{"from": seq, "to": seq}, ...], "summary": string}
            (D-44; видимость = журнал минус объединение covers).
          examples:
            - text: первый вопрос
            - callId: 01ARZ3NDEKTSV4RRFFQ69G5FAV
              tool: bash
              arguments: {command: 'ls -la'}
            - covers: [{from: 1, to: 12}]
              summary: Разбор первой задачи — договорились о подходе
        callId:
          type: string
          description: ULID вызова инструмента; только для TOOL_CALL/TOOL_RESULT/ASYNC_ACCEPTED.
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          minLength: 26
          maxLength: 26
        late:
          type: boolean
          description: >-
            Поле M3: признак второго TOOL_RESULT завершившегося асинхронного инструмента
            (late=true); для TOOL_CALL/ASYNC_ACCEPTED не выставляется.
        tokens:
          type: integer
          format: int32
          minimum: 0
          description: Оценка токенов события (для компакции); может отсутствовать.
        createdAt:
          type: string
          format: date-time
    AgentCatalog:
      type: object
      description: Конверт каталога агентов (без пагинации).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentCatalogItem'
    SessionPage:
      type: object
      description: Конверт-страница сессий (сортировка lastActivityAt desc).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionDto'
        nextCursor:
          type: string
          description: >-
            Непрозрачный (opaque) курсор следующей страницы (?cursor=) — клиент не
            интерпретирует его содержимое; отсутствует, когда страниц больше нет.
    MessagePage:
      type: object
      description: Конверт-страница событий журнала (порядок возрастания seq).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageDto'
        nextCursor:
          type: integer
          format: int64
          description: >-
            seq последнего события страницы — НЕ непрозрачный курсор: подставляется
            в следующий ?since= (та же seq-семантика); отсутствует, когда событий
            больше нет.
    CreateSessionRequest:
      type: object
      required: [agentKey]
      example:
        title: Разбор пайплайна
        agentKey: coder
        agentRev: 3
      properties:
        title:
          type: string
          minLength: 1
          description: Опционально; пустая строка невалидна (422).
        agentKey:
          type: string
          minLength: 1
          description: >-
            Ключ агента из каталога; пустая строка — 422 validation-failed,
            неизвестный ключ — 404 agent-not-found.
        agentRev:
          type: integer
          format: int32
          minimum: 1
          description: Пин к конкретной ревизии; отсутствует — берётся последняя (и тоже пинится).
    UpdateSessionRequest:
      type: object
      description: >-
        JSON Merge Patch (RFC 7396): отсутствующее поле — не менять; null — очистить title;
        пустая строка — 422 validation-failed; неизвестные члены патча допустимы и
        игнорируются.
      additionalProperties: true
      properties:
        title:
          type: [string, 'null']
          minLength: 1
          description: null — очистить title; строка — новый title (пустая строка невалидна, 422).
    SendMessageRequest:
      type: object
      required: [text]
      example:
        text: проверь, почему падает сборка на CI
      properties:
        text:
          type: string
          minLength: 1
          description: Текст USER-сообщения; автор атрибуцируется из JWT. Пустая строка невалидна (422).
    SendMessageAccepted:
      type: object
      description: Идентификаторы записанного события (обработка Turn'ом — асинхронная).
      required: [messageId, seq]
      properties:
        messageId:
          type: string
          description: ULID записанного события.
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          minLength: 26
          maxLength: 26
        seq:
          type: integer
          format: int64
          minimum: 1
    ValidationErrorItem:
      type: object
      required: [pointer, rule, message]
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) невалидного поля.
          examples:
            - /agentKey
        rule:
          type: string
          description: Машинное имя нарушенного правила (например required, minLength).
        message:
          type: string
          description: Человекочитаемое описание (по-русски).
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details + расширения code/errors (api-contracts §0.2, §6).
      required: [code]
      properties:
        type:
          type: string
          description: URI-тип проблемы; по умолчанию about:blank.
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: array
          description: Для 422-кодов — validation-failed, graph-invalid, dependency-invalid, params-schema.
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    WebhookProblemCode:
      type: string
      enum:
        - signature-invalid
        - task-not-waiting-webhook
        - trigger-revoked
      description: >-
        Вебхук-специфичные коды каталога §6 (без JWT — unauthenticated и codes
        задачного CRUD на вебхуках недостижимы). Инфраструктурные 406/413/415
        на вебхуках отдаются стандартным ProblemDetail с полным каталогом
        ProblemCode — консистентность с M1 (схемой WebhookError не типизируются).
    WebhookError:
      type: object
      description: >-
        RFC 9457 Problem Details для вебхук-специфичных ошибок (401/409/410) — как
        ProblemDetail, но code ограничен вебхук-подмножеством каталога
        (WebhookProblemCode). 406/413/415 на вебхуках — стандартный ProblemDetail
        (консистентность с M1).
      required: [code]
      properties:
        type:
          type: string
          description: URI-тип проблемы; по умолчанию about:blank.
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/WebhookProblemCode'
        errors:
          type: array
          description: Только для 422-кодов (в M2 на вебхуках не возникает).
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    TaskStatusProjection:
      type: string
      enum: [RUNNING, WAITING, SUCCEEDED, FAILED, CANCELLED]
      description: >-
        Денормализация текущего состояния задачи (data-model §4), обновляется
        транзакционно с current_state: RUNNING — исполняется; WAITING — системное
        ожидание (WAIT_WEBHOOK/WAIT_TASKS); SUCCEEDED/FAILED — терминалы по outcome;
        CANCELLED — принудительная отмена (stop).
    TransitionKind:
      type: string
      enum: [NEXT, ERROR, TIMEOUT, CANCEL]
      description: >-
        Тип перехода. NEXT — успех/по ребру NEXT; ERROR — неудача (exit≠0, провал
        валидации, решение агента по ERROR-ребру); TIMEOUT — таймаут состояния;
        CANCEL — служебный (принудительная отмена в '$CANCELLED'; в графе не обязан).
    WorkflowStateType:
      type: string
      enum: [AGENT, BASH_SCRIPT, WAIT_WEBHOOK, WAIT_TASKS, TERMINAL]
      description: Тип состояния графа (workflow-domain §2).
    TerminalOutcome:
      type: string
      enum: [SUCCESS, FAILED, CANCELLED]
      description: outcome TERMINAL-состояния → проекция статуса задачи.
    WorkflowRef:
      type: object
      description: Ссылка на пиннутую ревизию workflow.
      required: [key, rev]
      properties:
        key:
          type: string
        rev:
          type: integer
          format: int32
          minimum: 1
    TaskDto:
      type: object
      description: >-
        Состояние задачи (api-contracts §4.1). currentState — code из пиннутой
        ревизии или зарезервированный '$CANCELLED' (после stop). webhookUrl
        присутствует, когда currentState в WAIT_WEBHOOK-состоянии.
      required: [id, title, description, owner, author, workflow, currentState, statusProjection, suspended, tags, params, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        owner:
          type: string
          description: username владельца; при создании агентом наследуется от породившей сессии.
        author:
          type: [string, 'null']
          description: username автора-пользователя; null — задача создана агентом/триггером (авторство агента — через историю переходов).
        workflow:
          $ref: '#/components/schemas/WorkflowRef'
        currentState:
          type: string
          description: code текущего состояния (из ревизии) либо '$CANCELLED' (после stop).
        statusProjection:
          $ref: '#/components/schemas/TaskStatusProjection'
        suspended:
          type: boolean
          description: Аварийный флаг — планировщик пропускает задачу, новые переходы блокированы.
        parentTaskId:
          type: string
          format: uuid
          description: Только у подзадач.
        tags:
          type: array
          items:
            type: string
        params:
          type: object
          additionalProperties: true
          description: JSONB-параметры инстанса; иммутабельны после создания (PATCH params → 422 rule=immutable).
        webhookUrl:
          type: string
          format: uri
          description: Capability-URL вебхука (/api/webhooks/tasks/{taskId}/{token}); присутствует, когда currentState — WAIT_WEBHOOK-состояние.
        workspaceBindings:
          type: array
          description: Привязки workspace по состояниям (для CLIENT_EXEC-поверхности, M4); в M2 обычно отсутствует.
          items:
            type: object
            required: [stateCode, logicalKey]
            properties:
              stateCode:
                type: string
              logicalKey:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransitionDto:
      type: object
      description: >-
        Запись истории переходов (append-only, task_transition_history). reason —
        JSONB, форма зависит от источника: bash — {exitCode, output,
        durationMs, attempt}, где output — stdout и stderr, объединённые в один
        поток (контракт workspace-tools), exitCode может отсутствовать (kill без
        exit-кода); агент — {text} (обязательное обоснование); вебхук —
        {kind:webhook, source, payloadSummary} (полное тело не хранится — D-29);
        WAIT_TASKS — {closedBy:[taskId]} или
        {failed:[taskId]}; stop — {kind:stop, actor:user}.
      required: [id, fromState, toState, kind, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор записи истории (SSE id кадра task.transition — task_event_seq, не этот id).
        fromState:
          type: string
          description: code исходного состояния.
        toState:
          type: string
          description: code целевого состояния ('$CANCELLED' для stop).
        kind:
          $ref: '#/components/schemas/TransitionKind'
        reason:
          type: object
          additionalProperties: true
          description: Обоснование перехода (см. description схемы).
        createdAt:
          type: string
          format: date-time
    CommentDto:
      type: object
      description: Комментарий задачи (append-only; PATCH/DELETE не существует).
      required: [id, taskId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        body:
          type: string
        author:
          type: [string, 'null']
          description: username автора; null/отсутствует — агентский комментарий (NULL + агент-пометка в хранении).
        createdAt:
          type: string
          format: date-time
    TaskTreeNode:
      type: object
      description: Узел поддерева подзадач (обход по parentTaskId; children — уровень ниже, отсутствует на листьях/дне depth).
      required: [id, title, currentState, statusProjection, suspended]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        currentState:
          type: string
          description: code текущего состояния ('$CANCELLED' для остановленных).
        statusProjection:
          $ref: '#/components/schemas/TaskStatusProjection'
        suspended:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/TaskTreeNode'
    TaskPage:
      type: object
      description: Конверт-страница задач (сортировка updatedAt desc).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskDto'
        nextCursor:
          type: string
          description: Непрозрачный курсор следующей страницы (?cursor=); отсутствует, когда страниц больше нет.
    TransitionPage:
      type: object
      description: Конверт-страница истории переходов (порядок createdAt asc; курсор — пара (createdAt, id)).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransitionDto'
        nextCursor:
          type: string
          description: Непрозрачная пара (createdAt, id) последней записи страницы — в следующий ?since=; отсутствует, когда записей больше нет.
    CommentPage:
      type: object
      description: Конверт-страница комментариев (порядок createdAt asc).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentDto'
        nextCursor:
          type: string
          description: Непрозрачный курсор следующей страницы; отсутствует, когда страниц больше нет.
    TaskTreePage:
      type: object
      description: Поддерево подзадач (пагинации нет).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskTreeNode'
    CreateTaskRequest:
      type: object
      description: Тело создания задачи (POST /tasks и POST /tasks/{id}/subtasks).
      required: [title, description, workflowKey]
      example:
        title: Реализовать модуль биллинга
        description: По спеке contract-first, с тестами
        workflowKey: feature-delivery
        params:
          module: billing
        tags: [backend]
      properties:
        title:
          type: string
          minLength: 1
          description: Пустая строка невалидна (422 validation-failed).
        description:
          type: string
        workflowKey:
          type: string
          minLength: 1
          description: Ключ workflow; неизвестный — 404 workflow-not-found.
        rev:
          type: integer
          format: int32
          minimum: 1
          description: Пин к конкретной ревизии; отсутствует — берётся latestRev (и пинится).
        params:
          type: object
          additionalProperties: true
          description: Параметры инстанса; валидируются paramsSchema ревизии (422 params-schema); иммутабельны после создания.
        tags:
          type: array
          items:
            type: string
    UpdateTaskRequest:
      type: object
      description: >-
        JSON Merge Patch (RFC 7396): отсутствующее поле — не менять; null — очистить.
        `params` иммутабельны: включение params в патч → 422 validation-failed с
        ошибкой rule=immutable. Неизвестные члены патча допустимы и игнорируются.
      additionalProperties: true
      properties:
        title:
          type: [string, 'null']
          minLength: 1
          description: null — очистить; строка — новый title (пустая строка невалидна, 422).
        description:
          type: [string, 'null']
          minLength: 1
          description: null — очистить; строка — новое описание.
        tags:
          type: [array, 'null']
          items:
            type: string
          description: null — очистить теги; массив — заменить целиком.
    SuspendTaskRequest:
      type: object
      required: [cascade]
      properties:
        cascade:
          type: boolean
          description: true — приостановить также всё поддерево подзадач.
    AddTaskDependenciesRequest:
      type: object
      description: Рёбра blocked_by — атомарно, с валидацией циклов (422 dependency-invalid).
      required: [blockedBy]
      properties:
        blockedBy:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Идентификаторы блокирующих задач (эта задача не стартует, пока они не в нужном терминале).
    AddTaskCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          description: Текст комментария; пустая строка невалидна (422).
    TaskTransitionEvent:
      type: object
      description: Данные кадра `task.transition` SSE-потока задачи; SSE `id:` — task_event_seq. Тело SSE схемой не типизируется — машинный якорь для ручного парсера (клиент 8.5).
      required: [id, taskId, fromState, toState, kind, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор записи истории (TransitionDto.id).
        taskId:
          type: string
          format: uuid
        fromState:
          type: string
        toState:
          type: string
        kind:
          $ref: '#/components/schemas/TransitionKind'
        reason:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    TaskStatusEvent:
      type: object
      description: >-
        Данные кадра `task.status` (и снапшота при коннекте/реконнекте — последний
        статус задачи). taskEventSeq — текущий task_event_seq задачи: отправная
        точка для Last-Event-ID/?since при live-подписке после снапшота. Тело SSE
        схемой не типизируется — машинный якорь.
      required: [taskId, currentState, statusProjection, suspended, taskEventSeq]
      properties:
        taskId:
          type: string
          format: uuid
        currentState:
          type: string
        statusProjection:
          $ref: '#/components/schemas/TaskStatusProjection'
        suspended:
          type: boolean
        taskEventSeq:
          type: integer
          format: int64
          minimum: 0
          description: Текущий task_event_seq задачи (курсор SSE); в снапшоте — отправная точка для реконнекта.
    SubtaskTerminalEvent:
      type: object
      description: Данные кадра `subtask.terminal` — терминал подзадачи (для оркестратора «следить вместе»).
      required: [taskId, terminalTaskId, terminalStatus]
      properties:
        taskId:
          type: string
          format: uuid
          description: Задача-подписчик (родитель).
        terminalTaskId:
          type: string
          format: uuid
          description: Достигшая терминала подзадача.
        terminalStatus:
          $ref: '#/components/schemas/TaskStatusProjection'
          description: Терминальный статус — SUCCEEDED|FAILED|CANCELLED.
    TaskCommentEvent:
      type: object
      description: Данные кадра `task.comment` — новый комментарий (зеркало CommentDto).
      required: [id, taskId, body, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        body:
          type: string
        author:
          type: [string, 'null']
          description: username автора; null — агентский комментарий.
        createdAt:
          type: string
          format: date-time
    WorkflowDto:
      type: object
      description: >-
        Метаданные workflow. В списке (GET /workflows) — без revisions; при просмотре
        (GET /workflows/{key}) — со списком ревизий по возрастанию rev.
      required: [key, name, latestRev]
      properties:
        key:
          type: string
        name:
          type: string
        latestRev:
          type: integer
          format: int32
          minimum: 1
        revisions:
          type: array
          description: Только в GET /workflows/{key}.
          items:
            $ref: '#/components/schemas/WorkflowRevisionSummary'
    WorkflowRevisionSummary:
      type: object
      description: Краткая сводка ревизии (без графа).
      required: [rev, createdAt]
      properties:
        rev:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          type: string
          format: date-time
    WorkflowRevisionDto:
      type: object
      description: Ревизия workflow с графом (иммутабельная; правка = новая строка).
      required: [workflowKey, rev, graph, startState, createdAt]
      properties:
        workflowKey:
          type: string
        rev:
          type: integer
          format: int32
          minimum: 1
        graph:
          $ref: '#/components/schemas/WorkflowGraph'
        startState:
          type: string
          description: Стартовое состояние ревизии (code ∈ states[].code; задачи стартуют в нём).
        createdAt:
          type: string
          format: date-time
    WorkflowGraph:
      type: object
      description: >-
        Граф состояний (graph_jsonb; workflow-domain §2). Валидируется при
        сохранении (rules §2): уникальные codes, замкнутые переходы, ≥1 исходящий
        у нетерминальных, ERROR+TIMEOUT у BASH_SCRIPT/WAIT_*, достижимость TERMINAL,
        запрет fan-out. Циклы (возвраты) легальны.
      required: [states, transitions]
      properties:
        states:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkflowState'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTransition'
    WorkflowState:
      type: object
      description: >-
        Состояние графа. Поля по типу (workflow-domain §2): agent_key — AGENT;
        script — BASH_SCRIPT; scope+condition — WAIT_TASKS; payloadSchema —
        WAIT_WEBHOOK; paramsSchema — любая ревизия; timeout — BASH/WAIT (обязателен
        по правилам) и AGENT (предохранитель); outcome — TERMINAL. Имена полей —
        как в контракте graph_jsonb (agent_key — исключение из camelCase-правила API,
        унаследовано из контракта графа).
      required: [code, type]
      properties:
        code:
          type: string
          minLength: 1
          description: Уникален в ревизии (придумывает оркестратор); '$'-префиксы зарезервированы движком ('$CANCELLED').
        type:
          $ref: '#/components/schemas/WorkflowStateType'
        workspace:
          $ref: '#/components/schemas/WorkflowWorkspace'
        agent_key:
          type: string
          description: Для AGENT — ключ агента (ревизия фиксируется на STATE-сессии при входе).
        script:
          type: string
          description: Для BASH_SCRIPT — текст скрипта (запуск через WorkspaceTools; должен быть идемпотентным).
        scope:
          type: string
          description: Для WAIT_TASKS — ALL_CHILDREN | BLOCKED_BY | TAGGED(<tag>) | EXPLICIT(${task.params.<key>}).
        condition:
          type: string
          enum: [ALL_TERMINAL, ALL_SUCCESS]
          description: Для WAIT_TASKS — условие закрытия.
        payloadSchema:
          type: object
          additionalProperties: true
          description: Для WAIT_WEBHOOK — JSON-Schema валидации тела вебхука (ограниченный профиль D-58 — required, type, enum, items, properties первого уровня).
        paramsSchema:
          type: object
          additionalProperties: true
          description: JSON-Schema для params задач этой ревизии (ограниченный профиль D-58); создание задачи/триггера валидирует.
        timeout:
          type: string
          description: Длительность таймаута состояния (ISO-8601 duration, напр. PT30S, PT5M; семантика — kind-timeouts конфига движка).
        outcome:
          $ref: '#/components/schemas/TerminalOutcome'
    WorkflowWorkspace:
      type: object
      description: Привязка workspace состояния (workflow-domain §2).
      required: [type]
      properties:
        type:
          type: string
          enum: [SERVER_DIR, CLIENT_EXEC]
        mode:
          type: string
          enum: [AUTO, PATH]
          default: AUTO
          description: >-
            Для SERVER_DIR; по умолчанию AUTO. AUTO эквивалентно PATH, path=${task.id}
            (task-engine §BASH_SCRIPT — одно и то же место на диске); PATH — явный
            path-шаблон.
        path:
          type: string
          description: Для mode=PATH — шаблон с подстановками (${task.id}, ${task.params.*}).
    WorkflowTransition:
      type: object
      description: Переход графа; fan-out запрещён — не более одного исходящего перехода каждого kind у состояния.
      required: [from, to, kind]
      properties:
        from:
          type: string
          description: code исходного состояния.
        to:
          type: string
          description: code целевого состояния.
        kind:
          type: string
          enum: [NEXT, ERROR, TIMEOUT]
          description: >-
            Только рёбра графа. CANCEL в присылаемом графе невалиден → 422
            graph-invalid (rule=cancel-edge-forbidden): CANCEL — служебный движковый
            переход (запись в истории при stop), '$CANCELLED' — псевдо-код вне codes
            ревизии (D-54); CANCEL-рёбра в графе не объявляются.
    CreateWorkflowRequest:
      type: object
      required: [key, name, graph, startState]
      example:
        key: feature-delivery
        name: Доставка фич
        startState: plan
        graph:
          states:
            - code: plan
              type: AGENT
              agent_key: orchestrator
              timeout: PT30M
            - code: done
              type: TERMINAL
              outcome: SUCCESS
          transitions:
            - from: plan
              to: done
              kind: NEXT
      properties:
        key:
          type: string
          minLength: 1
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Kebab-case, уникален среди workflow (дубль - 422 validation-failed, rule=key-unique).
        name:
          type: string
          minLength: 1
        graph:
          $ref: '#/components/schemas/WorkflowGraph'
        startState:
          type: string
          minLength: 1
          description: >-
            Стартовое состояние ревизии (workflow-domain §2): code из states[].code;
            задача при создании получает current_state := startState.
            Не входит в states[].code - 422 graph-invalid (rule=unknown-state).
    CreateWorkflowRevisionRequest:
      type: object
      required: [graph, startState]
      properties:
        graph:
          $ref: '#/components/schemas/WorkflowGraph'
        startState:
          type: string
          minLength: 1
          description: Стартовое состояние новой ревизии (см. CreateWorkflowRequest.startState).
    WorkflowPage:
      type: object
      description: Конверт-страница workflow (сортировка createdAt desc).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDto'
        nextCursor:
          type: string
          description: Непрозрачный курсор следующей страницы; отсутствует, когда страниц больше нет.
    TriggerDto:
      type: object
      description: >-
        Входящий триггер: capability-URL создаёт задачу на пиннутой ревизии workflow
        с params/tags/owner триггера. url содержит HMAC-токен — секрет, утечка
        равнозначна потере контроля (revoke мгновенно умирает).
      required: [id, name, workflowKey, rev, params, tags, owner, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        workflowKey:
          type: string
        rev:
          type: integer
          format: int32
          minimum: 1
          description: Пин ревизии при создании триггера.
        params:
          type: object
          additionalProperties: true
          description: Параметры создаваемых задач (валидированы paramsSchema ревизии при создании триггера).
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
          description: username владельца (owner создаваемых задач).
        url:
          type: string
          format: uri
          description: Рабочий capability-URL (/api/webhooks/triggers/{triggerId}/{token}); умирает при revoke.
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: Момент отзыва; null — активен.
        createdAt:
          type: string
          format: date-time
    TriggerPage:
      type: object
      description: Конверт-страница триггеров (сортировка createdAt desc).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TriggerDto'
        nextCursor:
          type: string
          description: Непрозрачный курсор следующей страницы; отсутствует, когда страниц больше нет.
    CreateTriggerRequest:
      type: object
      required: [name, workflowKey]
      properties:
        name:
          type: string
          minLength: 1
        workflowKey:
          type: string
          minLength: 1
          description: Неизвестный — 404 workflow-not-found.
        rev:
          type: integer
          format: int32
          minimum: 1
          description: Пин к конкретной ревизии; отсутствует — latestRev (и пинится).
        params:
          type: object
          additionalProperties: true
          description: Параметры создаваемых задач; валидируются paramsSchema ревизии (422 params-schema).
        tags:
          type: array
          items:
            type: string
    TriggerWebhookAccepted:
      type: object
      description: Ответ вебхука триггера — созданная задача.
      required: [taskId]
      properties:
        taskId:
          type: string
          format: uuid
    SessionTreeNode:
      type: object
      description: Узел поддерева сессий; для STATE-узлов дополнительно taskId/stateCode (M2).
      required: [id, parentSessionId, kind, agent, runtimeStatus, lastSeq, lastActivityAt]
      properties:
        id:
          type: string
          format: uuid
        parentSessionId:
          type: [string, 'null']
          format: uuid
          description: null у корневой сессии поддерева.
        kind:
          $ref: '#/components/schemas/SessionKind'
        agent:
          $ref: '#/components/schemas/AgentRef'
        runtimeStatus:
          $ref: '#/components/schemas/SessionRuntimeStatus'
        lastSeq:
          type: integer
          format: int64
          minimum: 0
        taskId:
          type: string
          format: uuid
          description: Только STATE-узлы.
        stateCode:
          type: string
          description: Только STATE-узлы.
        lastActivityAt:
          type: string
          format: date-time
    SessionTreePage:
      type: object
      description: Поддерево сессий (пагинации нет).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionTreeNode'
