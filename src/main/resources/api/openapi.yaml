        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [Workflows]
      operationId: createWorkflow
      summary: Создать workflow (ревизия rev=1)
      description: >-
        Граф валидируется перед сохранением (уникальность codes, замкнутость
        переходов, ≥1 исходящий у нетерминальных, ERROR+TIMEOUT у BASH/WAIT_*,
        достижимость TERMINAL, запрет fan-out) — нарушения → 422 graph-invalid с
        errors[] {pointer, rule, message}. key — kebab-case, уникален среди workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
