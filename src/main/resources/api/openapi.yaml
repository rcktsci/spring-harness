          description: Страница триггеров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /triggers/{id}:
    parameters:
      - $ref: '#/components/parameters/TriggerId'
    delete:
      tags: [Triggers]
      operationId: revokeTrigger
      summary: Отозвать триггер
