openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: spring-harness API (M1+M2)
  version: 1.1.0-m2
  description: >-
    Машиночитаемый контракт M1+M2 — подмножество api-contracts v3: M1 — §0–§3.1 и
    openspec/changes/archive/2026-09-18-m1-session-core/specs/session-api (замороженная база; расширения
    M1-поверхностей — только аддитивные), M2 — задачный домен §4 и SSE задач §3.2
    (openspec/changes/m2-workflow-engine/specs). Источники истины — эти документы
    и docs/glossary.md; файл замораживается для генерации серверных интерфейсов и тест-клиента.

    Общие правила (api-contracts §0):
    * **Авторизация**: `Authorization: Bearer <Keycloak JWT>` на всех эндпоинтах; JWT обязан
      содержать группу из `harness.security.allowed-groups` (SSO-гейт, claim `groups`).
      Внутри — одно правило: аутентифицированный видит всё и пишет куда угодно (D-41).
    * **Ошибки**: RFC 9457 Problem Details (`application/problem+json`) с обязательным полем
      `code` из каталога (см. ProblemCode); `code` вне каталога — дефект реализации.
      Для 422 — расширение `errors[]` {pointer, rule, message}.
    * `405 method-not-allowed` возможен на любом пути чужим HTTP-методом — в operations
      не перечисляется (в OpenAPI невыразимо); `406 not-acceptable` — на всех ответах
      с JSON-телом; `415 unsupported-media-type` и `413 payload-too-large` — на всех
      эндпоинтах, принимающих тело (лимит `harness.limits.body`, дефолт 1 МБ).
    * **Пагинация**: конверт `{ items: [...], nextCursor? }` с `?cursor=&limit=`;
      потоковые выборки (messages, events) — `?since=<seq>`, интервал `(since, …]`.
    * **PATCH** — JSON Merge Patch (RFC 7396): отсутствующее поле — не менять,
      `null` — очистить.
    * `201` всегда с заголовком `Location`. Пути — kebab-case, поля — camelCase,
      enum — SCREAMING_SNAKE, время — ISO-8601 UTC.

    Обязательные опции генерации (шаг 2): `openApiNullable=false` — nullable-поля
    (`type: [x, 'null']`) без JsonNullable и без jackson-databind-nullable; зависимости
    Jackson 2 в main-runtime запрещены (AGENTS.md: HTTP-слой — Jackson 3, компиляционные
    нужды генератора — provided/test-scope). SSE-эндпоинты из генерации интерфейсов
    исключаются — реализуются на SseEmitter вручную (пункты шага 2:
    openspec/changes/archive/2026-09-18-m1-session-core/apply-notes.md; для M2 — тег TaskEvents).

    Дополнение M2 (api-contracts §4, §3.2, §6):
    * Входящие вебхуки `/api/webhooks/**` — без `/v1`, без JWT: аутентификация
      capability-токеном в пути (`token = HMAC-SHA256(server_secret, kind+':'+entityId)`);
      ошибки — RFC 9457 с кодом из каталога (схема WebhookError).
    * SSE задач `tasks/{id}/events` — курсор `task_event_seq` (монотонный, durable),
      снапшот при коннекте — последний `task.status`; из генерации исключён (ручной
      SseEmitter), схема — машинный якорь для парсера клиента.
    * Расширения M1-поверхностей (аддитивные): SessionDto дополнен `taskId`/`stateCode`
      (только STATE-сессии), `runtimeStatus` расширен до
      `IDLE|TURN_RUNNING|PARKED_ASYNC|PARKED_CLIENT` (присвоение PARKED_* — M3/M4),
      добавлен `GET /sessions/{id}/tree` (`taskId`+`stateCode` для STATE-узлов).
      MessageDto в M2 не меняется.
    * Инструмент агента `transition(toState, kind, reason)` — гейт metaTools
      (instructionSource=USER, task-engine/agent-turn) — REST-поверхности не требует;
      код `wrong-transition` (409) в каталоге ошибок достигается этим инструментом,
      не REST-операцией.
servers:
  - url: /api/v1
security:
  - bearerJWT: []
tags:
  - name: Agents
    description: Каталог агентов (управление ревизиями — вручную в БД, MVP)
  - name: Sessions
    description: Жизненный цикл сессий
  - name: SessionMessages
    description: Журнал сообщений сессии (append-only)
  - name: SessionCommands
    description: RPC-команды сессии (compact, stop) — осознанный RPC-стиль
  - name: SessionEvents
    description: SSE-поток событий сессии
  - name: Tasks
    description: Задачи — создание, просмотр, подзадачи, зависимости, история, комментарии, дерево
  - name: TaskCommands
    description: RPC-команды задачи (suspend, resume, stop) — осознанный RPC-стиль
  - name: TaskEvents
    description: SSE-поток событий задачи (из генерации исключён — ручной SseEmitter)
  - name: Workflows
    description: Шаблоны workflow и иммутабельные ревизии
  - name: Triggers
    description: Входящие триггеры (capability-URL → создание задачи)
  - name: Webhooks
    description: Входящие вебхуки (без JWT, без /v1; capability-токен в пути)
paths:
  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: Каталог агентов
      description: >-
        Все агенты с последней ревизией каждого ключа. Управление ревизиями через API
        не предоставляется (вручную в БД, MVP).
      responses:
        '200':
          description: Каталог агентов (возможно пустой).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCatalog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Создать FREE-сессию
      description: >-
        Создаёт только FREE-сессию (STATE создаёт движок задач, M2). Ревизия агента пинится:
        указанная `agentRev` или последняя на момент создания.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Сессия создана; Location — URL созданного ресурса.
          headers:
            Location:
              description: URL созданной сессии (/api/v1/sessions/{id}).
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: Список сессий
      description: Конверт-пагинация; сортировка по lastActivityAt desc (api-contracts §2).
      parameters:
        - name: mine
          in: query
          required: false
          description: Только сессии текущего пользователя (owner из JWT).
          schema:
            type: boolean
        - name: kind
          in: query
          required: false
          description: Фильтр по роду (FREE — пользовательские; STATE — сессии состояний задач, M2).
          schema:
            $ref: '#/components/schemas/SessionKind'
        - name: q
          in: query
          required: false
          description: Подстрока title.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Непрозрачный курсор из nextCursor предыдущей страницы.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница сессий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Сессия по идентификатору
      responses:
        '200':
          description: Сессия.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
    patch:
      tags: [Sessions]
      operationId: patchSession
      summary: Переименовать сессию (merge-patch)
      description: >-
        JSON Merge Patch (RFC 7396). Семантика: отсутствующее поле — не менять; null —
        очистить title; "" (пустая строка) — 422 validation-failed; неизвестные поля патча
        игнорируются. В M1 изменяемо только title; сообщения неизменяемы — отдельных
        PATCH/DELETE у них нет.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Обновлённая сессия.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sessions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [SessionMessages]
      operationId: sendMessage
      summary: Отправить USER-сообщение
      description: >-
        Атрибуция автора — из JWT (username). Асинхронно: событие записывается в журнал,
        Turn пробуждается (wake EVENT) либо будет поднят POLL-джобой; результат виден
        в SSE-потоке. Ответ — 202 с идентификаторами записанного события.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Сообщение принято и записано в журнал.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageAccepted'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [SessionMessages]
      operationId: listMessages
      summary: Читать видимые события журнала
      description: >-
        Интервал (since, …], порядок возрастания seq. Только видимые события: скрытые
        более поздним COMPACT не возвращаются (оригиналы читает агент инструментом
        read_compacted, M3).
      parameters:
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница видимых событий по возрастанию seq.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sessions/{id}/compact:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [SessionCommands]
      operationId: compactSession
      summary: Команда компакции (только FREE)
      description: >-
        Команда асинхронна: результат — COMPACT-событие в потоке, на границе раунда/после
        wake. Применима только к FREE; для STATE — 409 wrong-session-kind.
      responses:
        '202':
          description: Команда принята; COMPACT-событие появится в потоке.
          content:
            application/json:
              schema: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '409': { $ref: '#/components/responses/WrongSessionKind' }
  /sessions/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [SessionCommands]
      operationId: stopSession
      summary: Отменить активный Turn
      description: >-
        Отмена Turn'а сессии (в M3 — и всего поддерева субагентов). Идемпотентна:
        повторный вызов безопасен. Сессия не умирает — резюмируема.
      responses:
        '202':
          description: Команда отмены принята.
          content:
            application/json:
              schema: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
  /sessions/{id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [SessionEvents]
      operationId: streamSessionEvents
      summary: SSE-поток событий сессии
      description: >-
        Поток `text/event-stream` (api-contracts §3.1). Первым при коннекте/реконнекте
        отправляется снапшот `session.status` {runtimeStatus, lastTurnOutcome?}.
        Далее события: `message.created` — новое видимое событие журнала, данные —
        MessageDto (#/components/schemas/MessageDto; SSE `id:` = seq), `session.status` —
        при смене runtimeStatus/lastTurnOutcome, данные — SessionStatusEvent
        (#/components/schemas/SessionStatusEvent), `ping` — комментарий `: ping` каждые 15 с
        (`harness.sse.ping-interval`); в начале потока — `retry: 5000`.
        Продолжение после разрыва: заголовок `Last-Event-ID` приоритетнее `?since=`;
        доставка за интервал (since, …] — без пропусков и дублей.
        Эндпоинт исключается из генерации интерфейсов (шаг 2): контроллер реализуется
        на SseEmitter вручную; сгенерированный метод этой операции не используется.
      parameters:
        - $ref: '#/components/parameters/Since'
        - name: Last-Event-ID
          in: header
          required: false
          description: seq последнего полученного события (стандартный SSE-реконнект); приоритетнее query-параметра since.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: >-
            Поток событий; семантика и схемы кадров — в description операции. Тело схемой
            не типизируется (SSE-фреймы), генерация тела не производится — сервер отдаёт
            поток напрямую.
          content:
            text/event-stream:
              examples:
                frame:
                  description: Пример кадра message.created (пустая строка — разделитель кадров SSE).
                  value: |-
                    id: 15
                    event: message.created
                    data: {"id":"01ARZ3NDEKTSV4RRFFQ69G5FAV","seq":15,"kind":"USER","author":"ivanov","payload":{"text":"привет"},"createdAt":"2026-09-18T10:15:00Z"}

        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /sessions/{id}/tree:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSessionTree
      summary: Поддерево сессий («проваливание» в субагентов)
      description: >-
        Обход поддерева по parentSessionId (api-contracts §2). Для STATE-узлов
        (сессии состояний задачи, M2) дополнительно возвращаются taskId и stateCode.
        Пагинации нет — возвращается всё поддерево; depth ограничивает глубину.
      parameters:
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: Узел сессии и его потомки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTreePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tasks:
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Создать задачу (пин ревизии workflow)
      description: >-
        Задача пинится к конкретной ревизии workflow (`rev` из запроса или latestRev).
        `params` валидируются `paramsSchema` ревизии (если объявлена) — невалидные →
        422 params-schema. STATE-сессия при создании не появляется — её порождает
        вход задачи в AGENT-состояние.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Задача создана; Location — URL созданной задачи.
          headers:
            Location:
              description: URL созданной задачи (/api/v1/tasks/{id}).
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkflowNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: '422, code=validation-failed (тело) либо code=params-schema (params против paramsSchema ревизии).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Список задач
      description: >-
        Конверт-пагинация; сортировка updatedAt desc. Фильтры: parent — подзадачи
        указанной задачи; status — по statusProjection; mine — только владельца
        (owner из JWT); tags — задача содержит все указанные теги; q — подстрока
        title/description.
      parameters:
        - name: parent
          in: query
          required: false
          description: taskId родителя — вернуть только подзадачи.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Фильтр по проекции статуса.
          schema:
            $ref: '#/components/schemas/TaskStatusProjection'
        - name: mine
          in: query
          required: false
          description: Только задачи текущего пользователя (owner из JWT).
          schema:
            type: boolean
        - name: tags
          in: query
          required: false
          description: Теги через запятую; задача должна содержать все указанные.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: q
          in: query
          required: false
          description: Подстрока title/description.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница задач.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Задача по идентификатору
      responses:
        '200':
          description: Задача.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
    patch:
      tags: [Tasks]
      operationId: patchTask
      summary: Изменить задачу (merge-patch)
      description: >-
        JSON Merge Patch (RFC 7396): title, description, tags. `params` иммутабельны
        после создания — включение `params` в патч → 422 validation-failed с ошибкой
        rule=immutable. Неизвестные члены патча игнорируются.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Обновлённая задача.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tasks/{id}/subtasks:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: createSubtask
      summary: Создать подзадачу
      description: >-
        Тело и семантика — как POST /tasks; новая задача получает parentTaskId={id}.
        owner наследуется от родителя (инициатор — агент сессии состояния) или берётся
        из JWT (инициатор — пользователь).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Подзадача создана; Location — URL созданной подзадачи.
          headers:
            Location:
              description: URL созданной подзадачи (/api/v1/tasks/{id}).
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '404, code=task-not-found (родитель {id}) либо code=workflow-not-found (неизвестный workflowKey тела).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: '422, code=validation-failed (тело) либо code=params-schema.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /tasks/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [TaskCommands]
      operationId: suspendTask
      summary: Приостановить задачу (идемпотентно)
      description: >-
        Устанавливает suspended=true: планировщик пропускает задачу, новые переходы
        блокируются флагом. Активный Turn сессии состояния дорабатывает без
        прерывания (suspend — флаг, не отмена). cascade=true — дополнительно
        приостановить всё поддерево подзадач. Повторный вызов безопасен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendTaskRequest'
      responses:
        '204':
          description: Флаг установлен (или уже был установлен — идемпотентно).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tasks/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [TaskCommands]
      operationId: resumeTask
      summary: Возобновить задачу
      description: >-
        Снимает suspended для нетерминальной задачи и публикует task-wake:
        переоценка WAIT_TASKS / bootstrap AGENT-state подхватывают задачу без
        ожидания POLL. Для терминальной (SUCCEEDED|FAILED|CANCELLED) — 409
        task-already-terminal.
      responses:
        '204':
          description: Флаг снят; wake опубликован.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '409': { $ref: '#/components/responses/TaskAlreadyTerminal' }
  /tasks/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [TaskCommands]
      operationId: stopTask
      summary: Принудительно отменить задачу (всегда каскадно)
      description: >-
        suspend + отмена активных Turn'ов сессий состояния задачи и всех подзадач
        (каскад всегда — параметра cascade нет) + атомарный CAS
        current_state='$CANCELLED' (зарезервированный псевдо-код вне codes ревизии;
        запись в истории kind=CANCEL) + statusProjection=CANCELLED. Терминальная
        задача → 409 task-already-terminal; resume остановленной — тоже.
      responses:
        '202':
          description: Отмена принята; терминал появится в истории и SSE задачи.
          content:
            application/json:
              schema: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '409': { $ref: '#/components/responses/TaskAlreadyTerminal' }
  /tasks/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: addTaskDependencies
      summary: Добавить зависимости (blocked_by)
      description: >-
        Атомарно добавляет рёбра blocked_by. Валидация: все taskId существуют;
        нет self-loop; нет цикла (DFS по графу зависимостей) — нарушения →
        422 dependency-invalid с errors[]. После добавления ребра заинтересованные
        WAIT_TASKS-задачи переоцениваются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTaskDependenciesRequest'
      responses:
        '201':
          description: >-
            Рёбра добавлены; Location — URL блокированной задачи (осознанно — ребро
            blocked_by собственного URL не имеет).
          headers:
            Location:
              description: URL блокированной задачи (/api/v1/tasks/{id}) — созданное ребро отдельного ресурса не образует (api-contracts §4.1).
              schema:
                type: string
                format: uri-reference
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: '422, code=validation-failed (тело) либо code=dependency-invalid (self-loop/цикл/несуществующий taskId).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /tasks/{id}/dependencies/{blockerId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/BlockerId'
    delete:
      tags: [Tasks]
      operationId: removeTaskDependency
      summary: Снять зависимость
      description: >-
        Снимает ребро blocked_by; отсутствующее ребро — идемпотентный 204.
      responses:
        '204':
          description: Ребро снято (или отсутствовало).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
  /tasks/{id}/history:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskHistory
      summary: История переходов
      description: >-
        Конверт-страница за интервал (since, …] в порядке createdAt asc. Курсор —
        непрозрачная пара (createdAt, id) записи истории (стабильная пагинация при
        равных createdAt); nextCursor подставляется в следующий ?since=.
      parameters:
        - name: since
          in: query
          required: false
          description: >-
            Непрозрачный курсор — пара (createdAt, id) записи истории из nextCursor
            предыдущей страницы; отсутствие — с начала. Числовой seq (§0.4 для
            messages/events) здесь не применяется — курсор-пара санкционирована
            task-engine (стабильная пагинация при равных createdAt).
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница переходов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tasks/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: addTaskComment
      summary: Добавить комментарий (append-only)
      description: >-
        Комментарии иммутабельны (PATCH/DELETE не существует). Автор — username из
        JWT; агентские комментарии (из сессии состояния) — author=null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTaskCommentRequest'
      responses:
        '201':
          description: Комментарий записан; Location — URL комментария.
          headers:
            Location:
              description: >-
                URL коллекции комментариев (/api/v1/tasks/{id}/comments) — GET
                одиночного комментария в контракте отсутствует; идентификатор —
                в теле ответа.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [Tasks]
      operationId: listTaskComments
      summary: Список комментариев
      description: Конверт-пагинация; порядок createdAt asc.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница комментариев.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tasks/{id}/tree:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTaskTree
      summary: Поддерево подзадач
      description: >-
        Обход по parentTaskId; без depth — всё поддерево, depth=N — N уровней
        потомков. Узел несёт текущее состояние и проекцию статуса.
      parameters:
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: Узлы поддерева.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTreePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tasks/{id}/events:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [TaskEvents]
      operationId: streamTaskEvents
      summary: SSE-поток событий задачи
      description: >-
        Поток `text/event-stream` (api-contracts §3.2). Первым при коннекте/реконнекте
        отправляется снапшот — последний `task.status` (TaskStatusEvent). Далее события:
        `task.transition` — переход задачи (SSE `id:` = task_event_seq, данные —
        TaskTransitionEvent), `task.status` — при смене состояния/статуса (данные —
        TaskStatusEvent), `subtask.terminal` — терминал подзадачи (данные —
        SubtaskTerminalEvent), `task.comment` — новый комментарий (данные —
        TaskCommentEvent), `ping` — комментарий `: ping` (`harness.sse.ping-interval`);
        в начале потока — `retry: 5000`.
        Курсор `since` — `task_event_seq` задачи: монотонный сквозной номер события
        (нумеруются все события, включая не-transition), durable (колонка
        `task.task_event_seq`), инкремент транзакционно с эмиссией события — курсор
        переживает рестарт. Отсутствие/0 `since` — снапшот + полная история задачи
        (интервал (0, …]); отправная точка live-подписки — taskEventSeq из снапшота.
        Продолжение после разрыва: заголовок `Last-Event-ID`
        приоритетнее `?since=`; доставка за интервал (since, …] — без пропусков
        и дублей.
        Эндпоинт исключается из генерации интерфейсов (тег TaskEvents): контроллер
        реализуется на SseEmitter вручную; сгенерированный метод не используется.
      parameters:
        - name: since
          in: query
          required: false
          description: >-
            task_event_seq — события с seq > since (интервал (since, …]). Отсутствие
            или 0 — снапшот + полная история задачи (интервал (0, …]); клиенту,
            которому нужен только live, следует передать taskEventSeq из снапшота
            (кадр task.status).
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: task_event_seq последнего полученного события (стандартный SSE-реконнект); приоритетнее query-параметра since.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: >-
            Поток событий; семантика и схемы кадров — в description операции. Тело
            схемой не типизируется (SSE-фреймы), генерация тела не производится —
            сервер отдаёт поток напрямую.
          content:
            text/event-stream:
              examples:
                transitionFrame:
                  description: Пример кадра task.transition (пустая строка — разделитель кадров SSE).
                  value: |-
                    id: 7
                    event: task.transition
                    data: {"id":"019947f0-7a2b-7dc1-a5f5-3b9c2d4e6f80","taskId":"019947e8-3c1a-7b2d-9e4f-5a6b7c8d9e0f","fromState":"plan","toState":"run-checks","kind":"NEXT","reason":{"text":"проверки зелёные, перевожу дальше"},"createdAt":"2026-09-18T12:00:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /workflows:
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: Список workflow
      description: Конверт-пагинация; сортировка createdAt desc.
      parameters:
