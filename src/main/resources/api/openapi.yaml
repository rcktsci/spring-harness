          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRevisionDto'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkflowNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: '422, code=validation-failed (тело) либо code=graph-invalid.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /workflows/{key}/revisions/{rev}:
    parameters:
      - $ref: '#/components/parameters/WorkflowKey'
